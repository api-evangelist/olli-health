aid: olli-health
name: Olli Health
description: >-
  Olli Health is an AI-powered managed service for home health agencies that automates medical
  coding and OASIS (clinical assessment) and Plan of Care quality review. It pairs clinical
  artificial intelligence with certified human coders to ingest patient documentation (faxes,
  handwritten notes, and digital records), produce ICD-10 coding and OASIS review, and push
  approvals back into existing EHR workflows. The company reports 98%+ accuracy, roughly 4x faster
  turnaround, and about half the cost of traditional coding vendors, serving 100+ agencies and
  200,000+ patients. Olli Health is HIPAA compliant, SOC 2 certified, and its OASIS/Plan of Care
  quality review service is CHAP Verified. Added to the API Evangelist network as a Techstars
  portfolio company; as of this enrichment pass Olli Health publishes no public API, developer
  portal, or machine-readable API specification.
